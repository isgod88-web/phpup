; =============================================================================
; phpup 建议的 php.ini 设置（追加到新版 PHP 的 php.ini 末尾，或另存到 conf.d/ 目录）
; 改完后重启 php-fpm / Apache 生效
; PHP 版本请用 8.5.12 及以上（修复 PHP2Shell：CVE-2026-109618 / CVE-2026-109619）
; =============================================================================

; 兼容层：把 PHP 8 删除的 each()、create_function() 等函数补回来，不用改代码。
; 把 phpup_compat.php 放到服务器上，下面的路径改成它的实际位置（apply 模式已复制到站点根目录）。
auto_prepend_file = "@SITE@/phpup_compat.php"

; 短标签：工具已把代码里的 <? 改为 <?php，这里保持默认 Off 即可。
; 如果运行时用了 --keep-short-tags（没改短标签），这里必须是 On。
short_open_tag = @SHORT@

; 错误输出：PHP 8 把很多 Notice 升级成了 Warning，并新增了大量 Deprecated 提示。
; 生产环境不要把错误显示在页面上，只写日志；日志里不记录 Deprecated（它们不影响运行）。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
; error_log = /var/log/php/error.log

; PHP2Shell 官方公告给出的额外缓解措施（升级到 8.5.12 才是根本修复）。
; 站点没有用到“上传进度条”功能时建议关闭：
session.upload_progress.enabled = Off

; 以下与旧服务器保持一致即可（按实际情况取消注释）
; date.timezone = Asia/Shanghai
; memory_limit = 256M
; upload_max_filesize = 20M
; post_max_size = 20M
; max_execution_time = 60
